# Lives outside conf.d/ on purpose: nginx's main config auto-includes every
# conf.d/*.conf file at the http level, and this snippet (bare add_header
# lines, no server {} wrapper) is only meant to be pulled in explicitly —
# included from every `location` block in nginx.conf, since nginx's
# add_header does NOT inherit into a location that defines its own
# add_header (e.g. the per-location Cache-Control below), so these must be
# repeated per-location rather than set once at the server level.
#
# Compatible with Flutter Web's default (CanvasKit) renderer: it needs
# same-origin WebAssembly compilation, worker-src blob: (CanvasKit's
# worker), and inline style attributes (Flutter's engine sets
# `style="..."` on DOM nodes for text/semantics layout). connect-src allows
# any HTTPS origin because the API origin (API_BASE_URL) is only known at
# Flutter *build* time, baked into main.dart.js — not visible to this
# static, environment-agnostic nginx config.
#
# script-src/frame-src/style-src also allow https://accounts.google.com:
# "Connexion avec Google" (lib/core/network/google_auth_config.dart) uses
# Google Identity Services, whose web SDK injects its own
# <script src="https://accounts.google.com/gsi/client"> at runtime, loads
# its own stylesheet from https://accounts.google.com/gsi/style, and
# renders the sign-in button/prompt in an iframe from the same origin —
# missing any one of the three is a silent CSP violation (same failure
# shape the CanvasKit CDN block had: everything else on the page keeps
# working, only this feature quietly never completes — confirmed live: the
# style-src omission surfaced as the flow reporting "annulée ou échouée"
# with a console violation on gsi/style, even after script-src/frame-src
# were already fixed).
# Cross-Origin-Opener-Policy: same-origin-allow-popups (not "same-origin",
# and not simply omitted) is also part of the Google Sign-In fix. Google
# Identity Services opens accounts.google.com in a popup and relies on
# window.opener / postMessage to hand the credential back to this page.
# Without this header (the browser default, or a stricter "same-origin"),
# that opener relationship is severed and the popup's response never
# reaches us — same silent-failure shape as the CSP gaps above, confirmed
# live via a Cross-Origin-Opener-Policy console warning after script-src/
# style-src/frame-src and the signInButton() fix were already in place.
#
# connect-src also allows blob:, on top of https:/wss: — a THIRD instance of
# the same silent-failure shape. Picking a book cover (create_book_screen.dart
# -> package:file_selector) creates a blob: object URL for the chosen file
# (file_selector_web's DomHelper._convertFileToXFile), then cross_file's web
# XFile.readAsBytes() re-hydrates it with an XMLHttpRequest('get', thatBlobUrl)
# when it wasn't constructed with bytes already in hand (see cross_file's
# html.dart, the `_blob` getter) — that XHR is subject to connect-src like any
# other, and blob: was missing from it. Locally (`flutter run`, no CSP at all)
# this always works, which is why it looked environment-specific rather than
# a CSP gap: the picker "succeeds" with no visible error anywhere except the
# browser console, and create_book_screen.dart's _pickCoverImage() catches
# the resulting exception and shows a generic "Impossible d'ouvrir le
# sélecteur d'image" snackbar with no indication it was CSP that blocked it.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
